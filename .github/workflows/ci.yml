name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test, and dependency verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-tools==7.6.1
          python -m piptools sync requirements.txt requirements-dev.txt

      - name: Verify dependency consistency
        run: |
          python -m pip check
          python -m piptools compile --dry-run requirements.in
          python -m piptools compile --dry-run requirements-dev.in

      - name: Build test model artifact
        run: |
          PYTHONPATH=backend python -m ml \
            --dataset backend/tests/fixtures/hotel_reservations_sample.csv \
            --output models/smart_hotel_model.pkl

      - name: Ruff
        run: |
          ruff check backend alembic

      - name: Pytest
        run: |
          pytest backend/tests -q

      - name: Coverage
        run: |
          pytest backend/tests \
            --cov=app \
            --cov=agents \
            --cov=services \
            --cov=ml \
            --cov-report=term-missing \
            --cov-fail-under=85 \
            -q

      - name: Docker Compose validation
        shell: bash
        run: |
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose --env-file .env.example config --quiet

      - name: Build API image
        run: |
          docker compose --env-file .env.example build api

  security:
    name: Secret and repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check tracked files for hardcoded secrets
        shell: bash
        run: |
          if git grep -n -E 'P@\$\$w0rd|BEGIN .*PRIVATE KEY|AKIA[0-9A-Z]{16}' -- \
            ':!*.ipynb' ':!*.csv' ':!.github/workflows/ci.yml'; then
            echo "Potential hardcoded secret detected."
            exit 1
          fi

      - name: Check forbidden artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^models/|^\.coverage$|^\.env$)'; then
            echo "Generated/local artifacts must not be tracked."
            exit 1
          fi
