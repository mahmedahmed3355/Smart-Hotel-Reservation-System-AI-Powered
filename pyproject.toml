[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-hotel-reservation-system"
version = "0.1.0"
description = "AI-powered hotel reservation system with FastAPI, ML, OCR, and containerized deployment."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "sqlalchemy",
    "psycopg2-binary",
    "fastapi",
    "uvicorn",
    "alembic",
    "lightgbm",
    "google-cloud-storage",
    "Pillow",
    "python-multipart",
    "pytesseract",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "jupyter",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = [
    "app*",
    "agents*",
    "config*",
    "database*",
    "etl*",
    "ml*",
    "models*",
    "services*",
]
exclude = [
    "tests*",
    "scripts*",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["backend", "alembic"]
exclude = [
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "RUF",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
files = [
    "backend/app",
    "backend/agents",
    "backend/ml",
    "backend/services",
]
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
